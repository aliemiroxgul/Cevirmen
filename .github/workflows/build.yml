name: APK Derle

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: AltyaziCevirmen-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AltyaziCevirmen.apk
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" AltyaziCevirmen.apk \
            --repo "${{ github.repository }}" \
            --title "Altyazı Çevirmen #${{ github.run_number }}" \
            --notes "Otomatik derleme (${GITHUB_SHA::7}). AltyaziCevirmen.apk dosyasını telefona indirip kur." \
            --target "${{ github.sha }}" --latest
